# 基础训练配置文件。
# 实验名称、随机种子、设备和输出目录。
experiment:
  name: hidden_refactor_baseline
  seed: 42
  device: auto
  output_root: outputs/runs

# 数据集路径、图像尺寸和预处理参数。
dataset:
  # 数据集模式：优先使用 train_dir/val_dir，否则使用 source_dir 自动划分。
  train_dir: data/train
  val_dir: data/val
  source_dir: data/mirflickr25k
  train_split: 0.9
  split_seed: 42
  image_size: [64, 64]
  num_workers: 4
  pin_memory: true
  # 图像缩放、裁剪和数据增强设置。
  preprocess:
    # 裁剪前先缩放短边。
    train_resize_short_side: 96
    val_resize_short_side: 96
    interpolation: bicubic
    antialias: true
    random_hflip_prob: 0.0

# 训练轮数、batch size、学习率和保存频率。
train:
  batch_size: 32
  epochs: 60
  start_epoch: 1
  lr_encoder_decoder: 0.001
  lr_discriminator: 0.001
  lr_adversarial_noise: 0.001
  use_amp: true
  grad_clip_norm: 1.0
  log_interval: 10
  save_every: 1
  validate_every: 1

# 模型结构、payload 长度和损失权重。
model:
  message_length: 60
  payload_length: 30
  encoder_blocks: 4
  encoder_channels: 64
  use_encoder_mca: false
  encoder_mca_blocks: 1
  encoder_mca_dilations: [1, 2, 5]
  use_gabor_attention: false
  gabor_kernel_size: 15
  gabor_orientations: 8
  gabor_sigmas: [3.0, 5.0]
  gabor_gamma: 0.5
  gabor_wavelength: 8.0
  gabor_attention_strength: 0.5
  decoder_blocks: 7
  decoder_channels: 64
  use_decoder_stn: false
  decoder_stn_channels: 32
  decoder_stn_scale: 0.1
  use_decoder_diff_conv: false
  decoder_diff_layers: 3
  decoder_diff_scale: 1.0
  discriminator_blocks: 3
  discriminator_channels: 64
  use_discriminator: true
  use_vgg: false
  # 图像损失类型：pixel、vgg 或 mixed。
  vgg_loss_mode: vgg
  vgg_loss_weight: 0.03
  use_adversarial_noise_training: false
  residual_embedding: false
  residual_scale: 0.5
  residual_activation: tanh
  clamp_encoded: true
  use_yuv_loss: false
  yuv_loss_weight: 0.2
  yuv_channel_weights: [1.0, 10.0, 10.0]
  # 各项训练损失的权重。
  loss_weights:
    encoder: 1.0
    decoder: 2.0
    adversarial: 1.0
    payload: 2.0

# 训练时使用的噪声层和调度策略。
noise:
  strategy: weighted_random
  # 可选的可训练对抗噪声。
  adversarial:
    # 启用后追加对抗噪声层。
    enabled: false
    probability: 0.2
    params:
      epsilon: 0.02
      channels: 32
      blocks: 3
  # 候选噪声层列表。
  layers:
    # 不加噪声，用作基准。
    - name: identity
      probability: 0.10
      params: {}
    # 压缩类噪声。
    - name: jpeg
      probability: 0.9
      params:
        yuv_keep_weights: [25, 9, 9]
    - name: wechat
      probability: 0.9
      params:
        max_long_side: 1280
        yuv_keep_weights: [20, 8, 8]
    - name: quantization
      probability: 0.9
      params:
        fourier_terms: 10
    # 像素扰动噪声。
    - name: gaussian_noise
      probability: 0.9
      params:
        std: 0.05
    # 滤波类噪声。
    - name: gaussian_blur
      probability: 0.10
      params:
        sigma: 1.0
    # 裁剪和遮挡噪声。
    - name: dropout
      probability: 0.10
      params:
        keep_ratio: 0.7
    - name: crop
      probability: 0.10
      params:
        keep_ratio: 0.7
    - name: cropout
      probability: 0.15
      params:
        keep_ratio: 0.5
    # 几何变换噪声。
    - name: resize
      probability: 0.9
      params:
        ratio_min: 0.5
        ratio_max: 1.0
  # 分阶段噪声训练计划。
  curriculum:
    enabled: true
    # 每个阶段的 epoch 范围和噪声概率。
    schedule:
      - start_epoch: 1
        end_epoch: 20
        default_probability: 0.0
        probabilities:
          identity: 0.4
          jpeg: 0.3
          quantization: 0.3
      - start_epoch: 21
        end_epoch: 40
        default_probability: 0.0
        probabilities:
          jpeg: 0.25
          quantization: 0.25
          gaussian_noise: 0.2
          resize: 0.3
      - start_epoch: 41
        end_epoch: 60
        probabilities:
          identity: 0.1
          jpeg: 0.9
          wechat: 0.9
          quantization: 0.9
          gaussian_noise: 0.9
          gaussian_blur: 0.1
          dropout: 0.1
          crop: 0.1
          cropout: 0.15
          resize: 0.9

# 训练过程中的样例图保存设置。
visualization:
  sample_count: 8
  save_every: 1

# 日志级别设置。
logging:
  level: INFO
