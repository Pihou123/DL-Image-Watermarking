experiment:
  name: hidden_refactor_baseline
  seed: 42
  device: auto
  output_root: outputs/runs

dataset:
  # ImageFolder mode uses train_dir/val_dir; flat-folder mode uses source_dir.
  train_dir: data/train
  val_dir: data/val
  source_dir: data/mirflickr25k
  train_split: 0.9
  split_seed: 42
  image_size: [64, 64]
  num_workers: 4
  pin_memory: true
  preprocess:
    # Resize the short side before cropping.
    train_resize_short_side: 96
    val_resize_short_side: 96
    interpolation: bicubic
    antialias: true
    random_hflip_prob: 0.0

train:
  batch_size: 32
  epochs: 60
  start_epoch: 1
  lr_encoder_decoder: 0.001
  lr_discriminator: 0.001
  lr_adversarial_noise: 0.001
  use_amp: true
  grad_clip_norm: 1.0
  log_interval: 10
  save_every: 1
  validate_every: 1

model:
  message_length: 60
  payload_length: 30
  encoder_blocks: 4
  encoder_channels: 64
  use_encoder_mca: false
  encoder_mca_blocks: 1
  encoder_mca_dilations: [1, 2, 5]
  use_gabor_attention: false
  gabor_kernel_size: 15
  gabor_orientations: 8
  gabor_sigmas: [3.0, 5.0]
  gabor_gamma: 0.5
  gabor_wavelength: 8.0
  gabor_attention_strength: 0.5
  decoder_blocks: 7
  decoder_channels: 64
  use_decoder_stn: false
  decoder_stn_channels: 32
  decoder_stn_scale: 0.1
  use_decoder_diff_conv: false
  decoder_diff_layers: 3
  decoder_diff_scale: 1.0
  discriminator_blocks: 3
  discriminator_channels: 64
  use_discriminator: true
  use_vgg: false
  # Image loss: pixel, vgg, or mixed.
  vgg_loss_mode: vgg
  vgg_loss_weight: 0.03
  use_adversarial_noise_training: false
  residual_embedding: false
  residual_scale: 0.5
  residual_activation: tanh
  clamp_encoded: true
  use_yuv_loss: false
  yuv_loss_weight: 0.2
  yuv_channel_weights: [1.0, 10.0, 10.0]
  loss_weights:
    encoder: 1.0
    decoder: 2.0
    adversarial: 1.0
    payload: 2.0

noise:
  strategy: weighted_random
  adversarial:
    # Append adversarial noise when enabled.
    enabled: false
    probability: 0.2
    params:
      epsilon: 0.02
      channels: 32
      blocks: 3
  layers:
    # Pass-through
    - name: identity
      probability: 0.10
      params: {}
    # Compression
    - name: jpeg
      probability: 0.9
      params:
        yuv_keep_weights: [25, 9, 9]
    - name: wechat
      probability: 0.9
      params:
        max_long_side: 1280
        yuv_keep_weights: [20, 8, 8]
    - name: quantization
      probability: 0.9
      params:
        fourier_terms: 10
    # Pixel noise
    - name: gaussian_noise
      probability: 0.9
      params:
        std: 0.05
    # Filtering
    - name: gaussian_blur
      probability: 0.10
      params:
        sigma: 1.0
    # Erasure
    - name: dropout
      probability: 0.10
      params:
        keep_ratio: 0.7
    - name: crop
      probability: 0.10
      params:
        keep_ratio: 0.7
    - name: cropout
      probability: 0.15
      params:
        keep_ratio: 0.5
    # Geometry
    - name: resize
      probability: 0.9
      params:
        ratio_min: 0.5
        ratio_max: 1.0
  curriculum:
    enabled: true
    schedule:
      - start_epoch: 1
        end_epoch: 20
        default_probability: 0.0
        probabilities:
          identity: 0.4
          jpeg: 0.3
          quantization: 0.3
      - start_epoch: 21
        end_epoch: 40
        default_probability: 0.0
        probabilities:
          jpeg: 0.25
          quantization: 0.25
          gaussian_noise: 0.2
          resize: 0.3
      - start_epoch: 41
        end_epoch: 60
        probabilities:
          identity: 0.1
          jpeg: 0.9
          wechat: 0.9
          quantization: 0.9
          gaussian_noise: 0.9
          gaussian_blur: 0.1
          dropout: 0.1
          crop: 0.1
          cropout: 0.15
          resize: 0.9

visualization:
  sample_count: 8
  save_every: 1

logging:
  level: INFO
